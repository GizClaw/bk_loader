[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gizclaw-bk-loader"
version = "1.1.0.2.post1"
description = "Source-based Beken UART loader maintained by GizClaw"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Preserved Beken BSD/MIT declarations; see NOTICE.md"}
dependencies = [
  "click==8.4.2",
  "pycryptodome==3.23.0",
  "pyserial==3.5",
  "PyYAML==6.0.3",
]

[project.urls]
Repository = "https://github.com/GizClaw/bk_loader"

[project.scripts]
bk_loader = "bk_loader:cli"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["bk_loader", "tizen_entrance"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bkutils.config" = ["*.yaml", "*.yml"]
