name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/build.yml
  publish:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bk-loader-*
          merge-multiple: true
          path: release
      - name: Validate the release version and complete artifact matrix
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$TAG" = "v$VERSION"
          python scripts/release_index.py --directory release --version "$VERSION" --commit "$GITHUB_SHA"
      - name: Publish tested executables and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/*.tar.gz release/*.zip release/index.json release/SHA256SUMS \
            --verify-tag --title "BK Loader $TAG" \
            --notes "Standalone executables for macOS arm64/x64, Linux arm64/x64 and Windows x64. All five pass offline protocol, configuration and crypto checks. See README for source lineage and device support."
